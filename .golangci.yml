version: "2"
linters:
  enable:
    - goheader
    - revive
    - unused
    - staticcheck
    - govet
  settings:
    goheader:
      values:
        regexp:
          copyright-year: 20[0-9][0-9]
      template-path: code-header-template.txt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: 01ef727b5a403cf1df143adbf699aa0de2c765d9
