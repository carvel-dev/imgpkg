name: test-gh-external-registries-ghcr

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional: PR number to test (e.g., 123)"
        required: false
      ref:
        description: "Optional: git ref/branch/commit to test"
        required: false
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: write
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  test-ghcr:
    name: Test GH with GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Debug token existence
        run: |
          echo "Length: ${#GH_TOKEN}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Run Tests
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          IMGPKG_E2E_IMAGE: "ghcr.io/${{ github.repository_owner }}/github-action-test-relocation"
          IMGPKG_E2E_RELOCATION_REPO: "ghcr.io/${{ github.repository_owner }}/github-action-imgpkg-test"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          export IMGPKG_E2E_IMAGE="$IMGPKG_E2E_IMAGE-$GITHUB_RUN_ID"
          export IMGPKG_E2E_RELOCATION_REPO="$IMGPKG_E2E_RELOCATION_REPO-$GITHUB_RUN_ID"

          echo "Actor: ${{ github.actor }}"
          echo "Token permissions:"
          gh auth status

          docker pull registry:2

          function cleanup() {
            set +e
            echo "🔍 Testing API call..."
            gh api -H "Accept: application/vnd.github+json" "/orgs/$GHCR_OWNER/packages?package_type=container" || true

            echo "🧹 Cleaning up packages for run $GITHUB_RUN_ID..."

            # Fetch package list safely (store in variable)
            packages_json=$(gh api --paginate -X GET "/orgs/$GHCR_OWNER/packages?package_type=container" 2>/dev/null)
            if ! echo "$packages_json" | jq empty >/dev/null 2>&1; then
              echo "⚠️ Failed to fetch package list or invalid JSON returned. Skipping cleanup."
              return 0
            fi

            # Extract matching packages
            matching_pkgs=$(echo "$packages_json" | jq -r '.[].name' | grep "$GITHUB_RUN_ID" || true)
            if [ -z "$matching_pkgs" ]; then
              echo "No matching packages found for run ID $GITHUB_RUN_ID."
              return 0
            fi

            for pkg in $matching_pkgs; do
              echo "🗑️ Deleting $pkg ..."
              gh api --method DELETE -H "Accept: application/vnd.github+json" "/orgs/$GHCR_OWNER/packages/container/$pkg" || true
            done

            echo "✅ Cleanup done."
          }

          trap cleanup EXIT
          ./hack/test-all.sh
